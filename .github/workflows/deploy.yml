name: Deploy to GitHub Pages

# RETIRED 2026-08-25: sdd.ie now serves the full app from Vercel (project sdd-ie),
# including the dashboard/API that this Pages build strips out. Auto-deploy on push
# is disabled to stop the two systems overlapping. Left as manual-only for reference.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prepare for static export
        run: |
          rm -f src/middleware.ts
          rm -rf src/app/api
          sed -i "/export const dynamic/d" src/app/dashboard/page.tsx

      - name: Build
        run: npm run build
        env:
          STATIC_EXPORT: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
